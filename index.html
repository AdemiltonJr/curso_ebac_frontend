<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário Responsivo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="container-fluid">
        <h1>Cadastre-se</h1>
        <form id="formulario">
            <div class="row mb-3">
                <div class="col-12 col-md-6">
                    <label for="nome">Nome</label>
                    <input type="text" class="form-control" id="nome" name="nome">
                    <div class="invalid-feedback">Por favor, insira o nome.</div>
                </div>
                <div class="col-12 col-md-6">
                    <label for="sobrenome">Sobrenome</label>
                    <input type="text" class="form-control" id="sobrenome" name="sobrenome">
                </div>
            </div>
            <div class="mb-3">
                <label for="email">E-mail</label>
                <input type="email" class="form-control" id="email" name="email">
                <div class="invalid-feedback">Por favor, insira um e-mail válido.</div>
            </div>
            <div class="mb-3">
                <label for="telefone">Celular</label>
                <input type="tel" class="form-control" id="telefone" name="telefone">
                <div class="invalid-feedback">Por favor, insira o número do celular.</div>
            </div>
            <div class="mb-3">
                <label for="mensagem">Mensagem</label>
                <textarea class="form-control" id="mensagem" name="mensagem"></textarea>
            </div>
            <div class="form-check form-switch mt-3">
                <input class="form-check-input" type="checkbox" id="aceito-termos">
                <label class="form-check-label" for="aceito-termos">Concordo com os termos</label>
            </div>
            <button type="submit" class="btn mt-3">Enviar</button>

            <div class="alert alert-danger" id="alerta-termos">
                Por favor, concorde com os termos antes de enviar.
            </div>
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
    <script>
        $(document).ready(function () {
            $('#telefone').mask('(00) 00000-0000');

            $('#formulario').on('submit', function (e) {
                e.preventDefault();

                let isValid = true;

                $('#nome, #email, #telefone').each(function () {
                    if ($(this).val().trim() === '') {
                        $(this).addClass('is-invalid');
                        isValid = false;
                    } else {
                        $(this).removeClass('is-invalid');
                    }
                });

                if (!$('#aceito-termos').is(':checked')) {
                    $('#alerta-termos').fadeIn();
                    isValid = false;
                } else {
                    $('#alerta-termos').fadeOut();
                }

                if (isValid) {
                    alert('Formulário enviado com sucesso!');

                    $('#formulario')[0].reset();
                    $('.is-invalid').removeClass('is-invalid');
                    $('#alerta-termos').fadeOut();
                }
            });
        });
    </script>
</body>
</html>
