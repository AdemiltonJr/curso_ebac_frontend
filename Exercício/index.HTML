<body>
    <div class="container">
        <h1>VALIDAÇÃO DE DADOS</h1>
        <h2>Insira o primeiro número e o segundo número nos campos correspondentes.<br>O segundo número necessariamente precisa ser maior que o primeiro</h2>
        <form id="Form-maiorMenor">
            <input type="number" id="primeiroNumero" required placeholder="Insira o primeiro número">
            <input type="number" id="segundoNumero" required placeholder="Insira o segundo número">
            <button id="btn-Submeter" type="submit">Submeter</button>
        </form>
        <p class="mensagem-errado"></p>
    </div>
</body>
